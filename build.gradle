plugins {
	id 'java-library'
	// Pluginul oficial NeoForge ModDev
	id 'net.neoforged.moddev' version '2.0.140'
}

version = project.mod_version
group = project.mod_group_id

base {
	archivesName = project.mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
	// Specificăm versiunea din gradle.properties
	version = project.neoforge_version

	// Adăugăm accesul la clasele private
	accessTransformers {
		from('src/main/resources/META-INF/accesstransformer.cfg')
	}

	// Configurăm instanțele de testare (Client și Server)
	runs {
		client {
			client()
			systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
		}
		server {
			server()
			systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
			programArgument '--nogui'
		}
	}

	// Legăm codul nostru de NeoForge
	mods {
		"${project.mod_id}" {
			sourceSet(sourceSets.main)
		}
	}
}

repositories {
	maven { url = "https://cursemaven.com" }
	maven { url = "https://api.modrinth.com/maven" }
	maven { url = "https://maven.bawnorton.com/releases" } // Pentru MixinSquared
}

dependencies {
	// NeoForge își descarcă automat Minecraft-ul și API-ul de bază prin pluginul moddev.

	// Adăugăm MixinSquared pentru NeoForge
	implementation "com.bawnorton.mixinsquared:mixinsquared-neoforge:0.2.0-beta.6"
}

tasks.withType(JavaCompile).configureEach {
	options.encoding = 'UTF-8'
}